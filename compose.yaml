# P2 of the BPKD PRD, run locally: SIMDA-style MySQL -> Debezium -> Kafka (KRaft).
#
# Ports are chosen not to collide with the sikt-mini-lakehouse stack
# (3306 MySQL, 5432 PG, 4566 S3, 3300 Metabase): this stack uses 3307,
# 9092, and 8080.
name: apbd-realtime

services:
  apbd-mysql:
    image: mysql:8.4
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      # 8.4 defaults to MINIMAL metadata, which makes Debezium emit
      # UNKNOWN_COL0 column names instead of real ones.
      - --binlog-row-metadata=FULL
      - --binlog-expire-logs-seconds=86400
    environment:
      MYSQL_ROOT_PASSWORD: root-2026
      MYSQL_DATABASE: siktm
      MYSQL_USER: simda
      MYSQL_PASSWORD: simda-2026
    ports:
      - "3307:3306"
    volumes:
      - ./ops/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-2026"]
      interval: 5s
      timeout: 3s
      retries: 30

  apbd-kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://apbd-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Listener names are case-sensitive; the broker default is lowercase.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@apbd-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  apbd-connect:
    image: debezium/connect:3.0.0.Final
    environment:
      # This image's REST server always binds 8083 (REST_PORT in the image's
      # entrypoint does not move the actual listener), so we map 8083 to the
      # host's 8080 instead of touching the internals.
      BOOTSTRAP_SERVERS: apbd-kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8080:8083"
    depends_on:
      apbd-mysql:
        condition: service_healthy
      apbd-kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
