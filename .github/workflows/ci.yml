name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      # Unit tests only: the 7 integration tests need the compose stack
      # (MySQL, Kafka, Debezium) and are run locally with
      # `python -m pytest -m integration` — see the README quickstart.
      - run: python -m pytest -q -m "not integration"
